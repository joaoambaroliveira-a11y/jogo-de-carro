<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Carro com Dificuldade</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { background: #333; display: block; margin: auto; }
    #scoreboard {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }
    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    #menu button {
      margin: 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h3>Escolha a dificuldade</h3>
    <button onclick="iniciarJogo('facil')">Fácil</button>
    <button onclick="iniciarJogo('medio')">Médio</button>
    <button onclick="iniciarJogo('dificil')">Difícil</button>
  </div>

  <div id="scoreboard" style="display:none;">
    <h3>Ranking</h3>
    <ul id="ranking"></ul>
  </div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const rankingList = document.getElementById("ranking");
    const menu = document.getElementById("menu");
    const scoreboard = document.getElementById("scoreboard");

    let playerName = "";
    let laneWidth = canvas.width / 3;
    let lanes = [
      laneWidth/2 - 20,
      laneWidth + laneWidth/2 - 20,
      2*laneWidth + laneWidth/2 - 20
    ];

    let currentLane = 1;
    let car = { x: lanes[currentLane], y: 500, width: 40, height: 80 };
    let obstacles = [];
    let score = 0;
    let gameOver = false;
    let ranking = JSON.parse(localStorage.getItem("ranking")) || [];

    // Configurações de dificuldade
    let velocidadeObstaculos = 5;
    let chanceObstaculo = 0.03;

    function iniciarJogo(dificuldade) {
      playerName = prompt("Digite seu nome:");
      if (!playerName) playerName = "Jogador";

      if (dificuldade === "facil") {
        velocidadeObstaculos = 4;
        chanceObstaculo = 0.02;
      } else if (dificuldade === "medio") {
        velocidadeObstaculos = 6;
        chanceObstaculo = 0.03;
      } else if (dificuldade === "dificil") {
        velocidadeObstaculos = 8;
        chanceObstaculo = 0.05;
      }

      menu.style.display = "none";
      scoreboard.style.display = "block";
      mostrarRanking();
      gameLoop();
    }

    function drawCar(x, y, width, height, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width, height);

      ctx.fillStyle = "lightblue";
      ctx.fillRect(x + 5, y + 5, width - 10, 15);

      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(x + 5, y + 5, 4, 0, Math.PI*2);
      ctx.arc(x + width - 5, y + 5, 4, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(x + 5, y + height - 5, 4, 0, Math.PI*2);
      ctx.arc(x + width - 5, y + height - 5, 4, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.arc(x - 5, y + 25, 5, 0, Math.PI*2);
      ctx.arc(x + width + 5, y + 25, 5, 0, Math.PI*2);
      ctx.arc(x - 5, y + height - 25, 5, 0, Math.PI*2);
      ctx.arc(x + width + 5, y + height - 25, 5, 0, Math.PI*2);
      ctx.fill();
    }

    function updateObstacles() {
      obstacles.forEach(o => o.y += velocidadeObstaculos);
      obstacles = obstacles.filter(o => o.y < canvas.height);
      if (Math.random() < chanceObstaculo) {
        let lane = lanes[Math.floor(Math.random() * lanes.length)];
        obstacles.push({
          x: lane,
          y: -80,
          width: 40,
          height: 80,
          color: "red"
        });
      }
    }

    function checkCollision() {
      obstacles.forEach(o => {
        if (car.x < o.x + o.width &&
            car.x + car.width > o.x &&
            car.y < o.y + o.height &&
            car.y + car.height > o.y) {
          gameOver = true;
          salvarRanking();
        }
      });
    }

    function salvarRanking() {
      ranking.push({ nome: playerName, pontos: score });
      ranking.sort((a, b) => b.pontos - a.pontos);
      ranking = ranking.slice(0, 5);
      localStorage.setItem("ranking", JSON.stringify(ranking));
      mostrarRanking();
    }

    function mostrarRanking() {
      rankingList.innerHTML = "";
      ranking.forEach((jogador, i) => {
        const li = document.createElement("li");
        li.textContent = `${i+1}. ${jogador.nome} - ${jogador.pontos}`;
        rankingList.appendChild(li);
      });
    }

    function gameLoop() {
      if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over", 120, 300);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "white";
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(laneWidth, 0);
      ctx.lineTo(laneWidth, canvas.height);
      ctx.moveTo(2*laneWidth, 0);
      ctx.lineTo(2*laneWidth, canvas.height);
      ctx.stroke();

      drawCar(car.x, car.y, car.width, car.height, "blue");
      obstacles.forEach(o => drawCar(o.x, o.y, o.width, o.height, o.color));

      updateObstacles();
      checkCollision();

      score++;
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Pontuação: " + score, 10, 20);

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && car.x > lanes[0]) {
        car.x -= 15;
      }
      if (e.key === "ArrowRight" && car.x < lanes[2]) {
        car.x += 15;
      }
    });
  </script>
</body>
</html>
