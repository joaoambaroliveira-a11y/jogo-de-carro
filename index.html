<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Carro com Detalhes</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { background: #333; display: block; margin: auto; }
    #scoreboard {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.8);
      padding: 10px;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="scoreboard">
    <h3>Ranking</h3>
    <ul id="ranking"></ul>
  </div>
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const rankingList = document.getElementById("ranking");

    let playerName = prompt("Digite seu nome:");

    // largura de cada faixa
    let laneWidth = canvas.width / 3;
    // posições centrais das faixas
    let lanes = [
      laneWidth/2 - 20,
      laneWidth + laneWidth/2 - 20,
      2*laneWidth + laneWidth/2 - 20
    ];

    let currentLane = 1; // começa na faixa do meio
    let car = { x: lanes[currentLane], y: 500, width: 40, height: 80 };
    let obstacles = [];
    let score = 0;
    let gameOver = false;
    let ranking = JSON.parse(localStorage.getItem("ranking")) || [];

    function drawCar() {
      // carroceria
      ctx.fillStyle = "blue";
      ctx.fillRect(car.x, car.y, car.width, car.height);

      // para-brisa
      ctx.fillStyle = "lightblue";
      ctx.fillRect(car.x + 5, car.y + 5, car.width - 10, 15);

      // faróis
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(car.x + 5, car.y + 5, 5, 0, Math.PI*2);
      ctx.arc(car.x + car.width - 5, car.y + 5, 5, 0, Math.PI*2);
      ctx.fill();

      // lanternas traseiras
      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(car.x + 5, car.y + car.height - 5, 5, 0, Math.PI*2);
      ctx.arc(car.x + car.width - 5, car.y + car.height - 5, 5, 0, Math.PI*2);
      ctx.fill();

      // pneus
      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.arc(car.x - 5, car.y + 25, 6, 0, Math.PI*2);
      ctx.arc(car.x + car.width + 5, car.y + 25, 6, 0, Math.PI*2);
      ctx.arc(car.x - 5, car.y + car.height - 25, 6, 0, Math.PI*2);
      ctx.arc(car.x + car.width + 5, car.y + car.height - 25, 6, 0, Math.PI*2);
      ctx.fill();
    }

    function drawObstacles() {
      ctx.fillStyle = "red";
      obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.width, o.height));
    }

    function updateObstacles() {
      obstacles.forEach(o => o.y += 5);
      obstacles = obstacles.filter(o => o.y < canvas.height);
      if (Math.random() < 0.03) {
        let lane = lanes[Math.floor(Math.random() * lanes.length)];
        obstacles.push({
          x: lane,
          y: -80,
          width: 40,
          height: 80
        });
      }
    }

    function checkCollision() {
      obstacles.forEach(o => {
        if (car.x < o.x + o.width &&
            car.x + car.width > o.x &&
            car.y < o.y + o.height &&
            car.y + car.height > o.y) {
          gameOver = true;
          salvarRanking();
        }
      });
    }

    function salvarRanking() {
      ranking.push({ nome: playerName, pontos: score });
      ranking.sort((a, b) => b.pontos - a.pontos);
      ranking = ranking.slice(0, 5);
      localStorage.setItem("ranking", JSON.stringify(ranking));
      mostrarRanking();
    }

    function mostrarRanking() {
      rankingList.innerHTML = "";
      ranking.forEach((jogador, i) => {
        const li = document.createElement("li");
        li.textContent = `${i+1}. ${jogador.nome} - ${jogador.pontos}`;
        rankingList.appendChild(li);
      });
    }

    function gameLoop() {
      if (gameOver) {
        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over", 120, 300);
        return;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // linhas da pista
      ctx.strokeStyle = "white";
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(laneWidth, 0);
      ctx.lineTo(laneWidth, canvas.height);
      ctx.moveTo(2*laneWidth, 0);
      ctx.lineTo(2*laneWidth, canvas.height);
      ctx.stroke();

      drawCar();
      drawObstacles();
      updateObstacles();
      checkCollision();

      score++;
      ctx.fillStyle = "white";
      ctx.font = "20px Arial";
      ctx.fillText("Pontuação: " + score, 10, 20);

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" && currentLane > 0) {
        currentLane--;
        car.x = lanes[currentLane];
      }
      if (e.key === "ArrowRight" && currentLane < lanes.length - 1) {
        currentLane++;
        car.x = lanes[currentLane];
      }
    });

    mostrarRanking();
    gameLoop();
  </script>
</body>
</html>
